
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffee Draw</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#2b190f;color:#fff;
  font-family:Arial,sans-serif;
  background-image:
    radial-gradient(ellipse at 10% 10%,#75462655,transparent 35%),
    radial-gradient(ellipse at 90% 90%,#75462644,transparent 35%);
}
header{text-align:center;padding:24px 10px 8px}
h1{margin:0;color:#f4d6a6;font-size:clamp(23px,3vw,38px);letter-spacing:3px}
header p{color:#bd9163;font-size:12px;letter-spacing:3px}
.hint{text-align:center;color:#d8b58b;font-size:13px;padding:8px}
.viewport{overflow:auto;padding:15px 20px 35px}
.board{
  position:relative;
  width:1900px;height:1120px;
  margin:auto;
}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wires path{fill:none;stroke:#d9b17c;stroke-width:2}
.round-title{
  position:absolute;top:-24px;
  color:#d8b58b;font-size:12px;
  white-space:nowrap;
  z-index:3;
  background:#2b190f;
  padding:2px 5px;
  border-radius:4px;
}
.match{
  position:absolute;width:170px;height:64px;
  background:#393431;
  border:1.5px solid #83776d;
  border-radius:12px;
  box-shadow:0 4px 12px #160c0880;
}
.match.final-match{width:190px}
.teams{height:100%;display:flex;flex-direction:column}
.team{
  flex:1;min-height:0;width:100%;
  border:0;background:#514c48;color:white;
  padding:0 12px;text-align:left;
  font-size:13px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.team:first-child{border-radius:10px 10px 0 0}
.team:last-child{border-radius:0 0 10px 10px}
.team+ .team{border-top:1px solid #70665d}
/* Keep team slots unchanged on hover. */
.team:hover:not(:disabled):not(.winner) {
  background: #514c48;
  color: white;
}
.team.winner:hover:not(:disabled) {
  background: #f1d18e;
  color: #4c301b;
}

/* Hide the reveal bar on regular team slots. */
.team:not(.reveal)::after {
  display: none;
}
.team.winner{background:#f1d18e;color:#4c301b;font-weight:bold}
.team:disabled{cursor:default}
.coffee {
  position: absolute;
  z-index: 3;
  top: -55px;
  left: 50%;
  transform: translateX(-50%);

  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 3px solid #f4d9ac;

  background: radial-gradient(
    circle at 35% 30%,
    #bd8952,
    #71401f
  );

  box-shadow: 0 3px 10px #160b07a0;
  display: grid;
  place-items: center;
  pointer-events: auto;
  cursor: pointer;
  padding: 0;
  overflow: hidden;
  color: #fff3df;
  font-size: 25px;
}
.coffee span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 1px #fff);
}
.coffee img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.coffee:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.pattern-name {
  position: absolute;
  z-index: 4;
  top: -39px;
  left: calc(50% + 30px);
  max-width: 105px;
  padding: 5px 8px;
  border: 1px solid #b98b59;
  border-radius: 8px;
  background: #3b2417ee;
  color: #f4d6a6;
  font-size: 10px;
  line-height: 1.2;
  white-space: nowrap;
  box-shadow: 0 2px 6px #160b0780;
  pointer-events: none;
}
.pattern-name:empty { display: none; }
.coffee-hint {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  color: #f4d6a6;
  font-size: 9px;
  white-space: nowrap;
  pointer-events: none;
}
.champion{
  width:280px;margin:8px auto 25px;
  padding:16px;border:1px solid #a77946;
  border-radius:14px;background:#40291b;text-align:center;
  color:#f3d29a;
}
.champion strong{font-size:14px}
#championName{
  margin-top:12px;padding:12px;
  background:#514c48;border-radius:8px;color:white;
}
#championName.crowned{background:#f1d18e;color:#4c301b;font-weight:bold}
.reset{
  display:block;margin:0 auto 30px;
  border:1px solid #c19763;border-radius:24px;
  padding:10px 20px;color:#f4d6a6;background:transparent;
  cursor:pointer;
}
.team {
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

.team.reveal {
  animation: revealText 1s ease-in-out;
}

.team.reveal::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #000;
  z-index: 2;
  transform: scaleX(0);
  transform-origin: left;
  animation: blackWipe 1s ease-in-out forwards;
  pointer-events: none;
}

.team {
  position: relative;
  isolation: isolate;
}

.team.reveal {
  animation: textReveal 1s linear;
}

.team.reveal::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #000;
  transform: scaleX(0);
  transform-origin: left;
  pointer-events: none;
  animation: blackBar 1s ease-in-out forwards;
}

@keyframes blackBar {
  0%   { transform: scaleX(0); transform-origin: left; }
  45%  { transform: scaleX(1); transform-origin: left; }
  55%  { transform: scaleX(1); transform-origin: right; }
  100% { transform: scaleX(0); transform-origin: right; }
}

@keyframes textReveal {
  0%, 55% { color: transparent; }
  100% { color: white; }
}

/* Latte art reveal effect on the display screen. */
.coffee.pattern-reveal img {
  animation: patternReveal 1.05s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes patternReveal {
  0% { opacity: .15; transform: rotate(-120deg) scale(.35); filter: blur(5px); }
  65% { opacity: 1; transform: rotate(12deg) scale(1.12); filter: blur(0); }
  100% { opacity: 1; transform: rotate(0) scale(1); filter: blur(0); }
}
.match { transition: transform .25s ease, box-shadow .25s ease; }

.mode-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px}
.mode-bar a,.mode-bar button{border:1px solid #c19763;border-radius:24px;padding:10px 16px;color:#f4d6a6;background:#40291b;text-decoration:none;cursor:pointer;font-size:14px}
.mode-bar .active{background:#f1d18e;color:#4c301b;font-weight:bold}
.mode-status{text-align:center;color:#d8b58b;font-size:12px;padding:0 12px 8px}
.control-panel{max-width:1000px;margin:0 auto 24px;padding:16px;border:1px solid #a77946;border-radius:14px;background:#40291b}
.control-panel h2{margin:0 0 12px;text-align:center;font-size:18px;color:#f4d6a6}
.team-edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.team-edit-grid input{width:100%;padding:9px;border-radius:7px;border:1px solid #8e6a48;background:#fff8ef;color:#2b190f}
.panel-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.panel-actions button{border:1px solid #c19763;border-radius:22px;padding:10px 16px;color:#f4d6a6;background:#514033;cursor:pointer}
.panel-actions .primary{background:#f1d18e;color:#4c301b;font-weight:bold}
body.show-mode .team{pointer-events:none;cursor:default}
body.show-mode .coffee{pointer-events:none;cursor:default}
@media(max-width:700px){.control-panel{margin:0 10px 20px}.board{transform-origin:top left}}
 
.display-admin{margin:16px 0;padding:14px;border:1px solid #8d6848;border-radius:12px;background:#332116;display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.display-admin h3{width:100%;margin:0;color:#f4d6a6}.display-admin label{display:flex;flex-direction:column;gap:6px;color:#e5c39b;font-size:13px}.display-admin select{padding:9px;border-radius:8px;background:#fff8ef;color:#3d281a;border:1px solid #c19763}.display-admin .display-lock{flex-direction:row;align-items:center}.display-admin .display-lock input{width:18px;height:18px}.display-help{width:100%;font-size:12px;color:#d8b58b;margin:0}.ranking-view{max-width:1000px;margin:10px auto 30px;padding:18px;background:#40291b;border:1px solid #a77946;border-radius:14px}
.ranking-view h2,.ranking-view p{text-align:center;color:#f4d6a6}
.ranking-view p{font-size:13px;color:#d8b58b}
.rank-row{display:grid;grid-template-columns:90px 1fr 150px;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #72543b}
.rank-row:last-child{border-bottom:0}
.rank-number{font-weight:bold;color:#f1d18e}
.rank-team{overflow-wrap:anywhere}
.rank-status{color:#d8b58b;font-size:12px;text-align:right}
@media(max-width:600px){.rank-row{grid-template-columns:60px 1fr}.rank-status{grid-column:2;text-align:left}}
</style>
</head>
<body>

<header>
  <h1> COFFEE DRAW</h1>
  <p>LATTE ART PATTERN</p>
</header>

<nav class="mode-bar" id="modeBar">
  <button id="openShowWindow" class="active" type="button">Open Display Window</button>
  <button id="copyShow" type="button">Copy Display Link</button>
</nav>
<div class="mode-status" id="modeStatus"></div>
<section class="control-panel" id="controlPanel" hidden>
  <h2>TEAM Control</h2>
  <p style="text-align:center;font-size:13px;color:#d8b58b"></p>
  <div class="team-edit-grid" id="teamEditGrid"></div>
  <div class="display-admin" id="displayAdmin">
    <h3>Display Settings</h3>
    <label>Page to display
      <select id="displayPage">
        <option value="auto">Rotate automatically</option>
        <option value="bracket">Bracket only</option>
        <option value="ranking">Rankings only</option>
      </select>
    </label>
    <label>Switch pages every
      <select id="displayInterval">
        <option value="10">10 seconds</option><option value="15" selected>15 seconds</option>
        <option value="30">30 seconds</option><option value="60">60 seconds</option>
      </select>
    </label>
    <label class="display-lock"><input type="checkbox" id="displayLock"> Lock display (stop automatic rotation)</label>
    <button type="button" class="primary" id="saveDisplaySettings">Save Display Settings</button>
    <p class="display-help">Choose a page to keep on the display, or enable automatic rotation. When locked, the display stays on the selected page.</p>
  </div>
  <div class="panel-actions">
    <button class="primary" id="saveNames" type="button">Save Team Names</button>
    <button id="resetButton" type="button">Reset</button>
  </div>
</section>

<nav class="mode-bar" id="viewBar">
  <button type="button" id="showBracket" class="active">Bracket</button>
  <button type="button" id="showRanking">Rankings</button>
</nav>
<section id="rankingView" class="ranking-view" hidden>
  <h2>32-Team Rankings</h2>
  <p>Ranks teams from 1 to 32. Winners move up the table, while eliminated teams move down.</p>
  <div id="rankingTable"></div>
</section>
<div class="viewport" id="bracketViewport">
  <div class="board" id="board">
    <svg class="wires" id="wires" viewBox="0 0 1900 1120"></svg>
  </div>
</div>

<script>
function teamLabel(index) {
  let n = index + 1, label = "";
  while (n > 0) { n--; label = String.fromCharCode(65 + (n % 26)) + label; n = Math.floor(n / 26); }
  return `Team ${label}`;
}
const teamNames = Array.from({ length: 32 }, (_, i) => teamLabel(i));

const matches = {};
const board = document.getElementById("board");
const STORAGE_KEY = "coffee-Draw-state-v2";
const DISPLAY_KEY = "coffee-Draw-display-v1";
let displayConfig = { page: "auto", interval: 15, locked: false };
let displayTimer = null;
const params = new URLSearchParams(location.search);
// Open the control panel by default when no mode is specified.
const mode = params.get("mode") === "show" ? "show" : "control";
const isControl = mode === "control";
document.body.classList.toggle("show-mode", !isControl);
document.getElementById("controlPanel").hidden = !isControl;
document.getElementById("openShowWindow").hidden = !isControl;
document.getElementById("copyShow").hidden = !isControl;
document.getElementById("viewBar").hidden = !isControl;
document.getElementById("displayAdmin").hidden = !isControl;
document.getElementById("modeStatus").textContent = isControl
  ? ""
  : " ";

document.getElementById("openShowWindow").addEventListener("click", () => {
  const url = new URL(location.href);
  url.searchParams.set("mode", "show");
  // Request a new window; the browser may open a tab depending on its settings.
  const popup = window.open(url.href, "CoffeeDrawShow", "popup=yes,width=1500,height=900,resizable=yes,scrollbars=yes");
  if (!popup) {
    alert("The browser blocked the new window. Allow pop-ups for this page, then try again.");
  }
});

document.getElementById("copyShow").addEventListener("click", async () => {
  const url = new URL(location.href);
  url.searchParams.set("mode", "show");
  try { await navigator.clipboard.writeText(url.href); alert("Display link copied."); }
  catch { prompt("Copy this display link:", url.href); }
});

function saveState() {
  const state = {
    teamNames,
    matches: Object.fromEntries(Object.entries(matches).map(([id, m]) => [id, {
      teams: m.teams, winner: m.winner, pattern: m.pattern || null,
      patternName: m.patternName || "", revealSlot: Number.isInteger(m.revealSlot) ? m.revealSlot : null
    }]))
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  try {
    const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!state) return;
    if (Array.isArray(state.teamNames) && state.teamNames.length === teamNames.length) {
      state.teamNames.forEach((name, i) => teamNames[i] = name);
    }
    if (state.matches) {
      for (const [id, saved] of Object.entries(state.matches)) {
        if (!matches[id]) continue;
        matches[id].teams = Array.isArray(saved.teams) ? saved.teams : matches[id].teams;
        matches[id].winner = saved.winner ?? null;
        matches[id].pattern = saved.pattern || null;
        matches[id].patternName = saved.patternName || "";
        matches[id].revealSlot = Number.isInteger(saved.revealSlot) ? saved.revealSlot : null;
      }
    }
  } catch (error) { console.warn("Failed to load draw data.", error); }
}

function setVisiblePage(page) {
  const showRanking = page === "ranking";
  bracketViewport.hidden = showRanking;
  rankingView.hidden = !showRanking;
  document.getElementById("showBracket").classList.toggle("active", !showRanking);
  document.getElementById("showRanking").classList.toggle("active", showRanking);
  if (showRanking) renderRanking();
}
function applyDisplayConfig() {
  if (displayTimer) { clearInterval(displayTimer); displayTimer = null; }
  if (isControl) {
    // Keep the control panel fixed; do not rotate pages.
    document.getElementById("displayPage").value = displayConfig.page;
    document.getElementById("displayInterval").value = String(displayConfig.interval);
    document.getElementById("displayLock").checked = !!displayConfig.locked;
    return;
  }
  // Page selection and rotation settings apply only to the display screen.
  if (displayConfig.page === "bracket") setVisiblePage("bracket");
  else if (displayConfig.page === "ranking") setVisiblePage("ranking");
  else if (displayConfig.locked) { /* Keep the current page on the display. */ }
  else {
    displayTimer = setInterval(() => {
      if (document.hidden) return;
      setVisiblePage(rankingView.hidden ? "ranking" : "bracket");
    }, Math.max(5, Number(displayConfig.interval) || 15) * 1000);
  }
}
function loadDisplayConfig() {
  try { const saved = JSON.parse(localStorage.getItem(DISPLAY_KEY) || "null"); if (saved) displayConfig = { ...displayConfig, ...saved }; } catch {}
  applyDisplayConfig();
}
document.getElementById("saveDisplaySettings").addEventListener("click", () => {
  displayConfig = { page: document.getElementById("displayPage").value, interval: Number(document.getElementById("displayInterval").value), locked: document.getElementById("displayLock").checked };
  localStorage.setItem(DISPLAY_KEY, JSON.stringify(displayConfig));
  applyDisplayConfig();
  alert("Display settings saved.");
});

window.addEventListener("storage", (event) => {
  if (event.key === DISPLAY_KEY && event.newValue) {
    try { displayConfig = { ...displayConfig, ...JSON.parse(event.newValue) }; applyDisplayConfig(); } catch {}
    return;
  }
  if (event.key !== STORAGE_KEY || !event.newValue) return;
  let incoming = null;
  try { incoming = JSON.parse(event.newValue); } catch {}
  if (!isControl && incoming?.matches) {
    for (const [id, saved] of Object.entries(incoming.matches)) {
      if (matches[id] && saved.pattern && saved.pattern !== matches[id].pattern) {
        matches[id].patternChanged = true;
      }
    }
  }
  loadState();
  render();
  if (isControl) renderTeamEditor();
});

function addMatch(id, round, index, teams, x, y, side) {
  matches[id] = {
    id, round, index, teams, x, y, side,
    winner: null
  };
}

// 32-team bracket: 16 teams on each side.
// Center each advancing matchup between its feeder matches.
const roundXs = { L: [10, 220, 430, 640], R: [1690, 1480, 1270, 1060] };
const roundCounts = [8, 4, 2, 1];
for (const side of ["L", "R"]) {
  for (let round = 1; round <= 4; round++) {
    const count = roundCounts[round - 1];
    const step = 1080 / count;
    const cardY = (i) => Math.round(step * (i + 0.5) - 32);
    for (let i = 0; i < count; i++) {
      const teamIndex = side === "L" ? i * 2 : 16 + i * 2;
      const teams = round === 1
        ? [teamNames[teamIndex], teamNames[teamIndex + 1]]
        : ["", ""];
      addMatch(`${side}${round}-${i}`, round, i, teams, roundXs[side][round - 1], cardY(i), side);
    }
  }
}
addMatch("FINAL", 5, 0, ["", ""], 850, 527, "C");

// Explicitly determine where the winner advances.
function nextMatch(id) {
  const m = matches[id];
  if (m.round >= 5) return null;
  if (m.round === 4) return { id: "FINAL", slot: m.side === "L" ? 0 : 1 };
  return { id: `${m.side}${m.round + 1}-${Math.floor(m.index / 2)}`, slot: m.index % 2 };
}

// Clear downstream results when a winner changes.
function clearDownstream(id) {
  const next = nextMatch(id);
  if (!next) return;

  const target = matches[next.id];
  target.teams[next.slot] = "";
  target.winner = null;

  clearDownstream(next.id);
}

// Select the winning team.
function chooseWinner(id, slot) {
  if (!isControl) return;
  const m = matches[id];
  if (!m.teams[slot]) return;

  // Clear affected downstream results.
  clearDownstream(id);

  m.winner = slot;

  // Advance the winner to the next round.
  const next = nextMatch(id);

  if (next) {
    matches[next.id].teams[next.slot] = m.teams[slot];
    matches[next.id].revealSlot = next.slot;
  }

  saveState();
  render();
}

// Latte art images (the assets/tight folder must be next to this HTML file).
const lattePatterns = [
  { path: "assets/tight/rosetta.png", name: "Rosetta" },
  { path: "assets/tight/framed-tulip.png", name: "Framed Tulip" },
  { path: "assets/tight/wingsetta.png", name: "Wingsetta" },
  { path: "assets/tight/rose.png", name: "Rose" },
  { path: "assets/tight/framed-heart.png", name: "Framed Heart" },
  { path: "assets/tight/tulip.png", name: "Tulip" },
  { path: "assets/tight/heart.png", name: "Heart" },
  { path: "assets/tight/framed-rosetta.jpg", name: "Framed Rosetta" },
  { path: "assets/tight/swan.png", name: "Swan" }
];

function randomizePattern(id, badge) {
  if (!isControl) return;
  const m = matches[id];
  if (!m || m.spinning) return; // Prevent repeated clicks while spinning.

  m.spinning = true;
  badge.disabled = true;
  badge.setAttribute("aria-label", "Randomizing latte art");
  badge.title = "Randomizing...";

  // Prefer a different pattern from the previous one.
  const choices = lattePatterns.filter(item => item.path !== m.pattern);
  const pool = choices.length ? choices : lattePatterns;
  const finalPattern = pool[Math.floor(Math.random() * pool.length)];

  // Cycle quickly at first, then slow down before stopping.
  const startedAt = Date.now();
  const duration = 1900;
  let frame = 0;

  function spinFrame() {
    const elapsed = Date.now() - startedAt;
    const progress = Math.min(elapsed / duration, 1);

    if (progress >= 1) {
      m.pattern = finalPattern.path;
      m.patternName = finalPattern.name;
      m.spinning = false;
      saveState();

      // Update the selected pattern immediately if the card is still on screen.
      if (badge.isConnected) {
        badge.innerHTML = `<img src="${m.pattern}" alt="${m.patternName}">`;
        badge.disabled = false;
        badge.setAttribute("aria-label", "Randomize latte art again");
        badge.title = "Click to randomize again";
        const nameLabel = badge.parentElement.querySelector(".pattern-name");
        if (nameLabel) nameLabel.textContent = m.patternName;
      } else {
        // If the bracket was redrawn while spinning, render the selected pattern.
        render();
      }
      return;
    }

    // Gradually increase the interval to make the wheel appear to slow down.
    const delay = 45 + Math.pow(progress, 2.4) * 260;
    let preview = lattePatterns[Math.floor(Math.random() * lattePatterns.length)];
    if (frame % 3 === 0) preview = lattePatterns[(frame + Math.floor(Math.random() * lattePatterns.length)) % lattePatterns.length];
    badge.innerHTML = `<img src="${preview.path}" alt="Randomizing latte art">`;
    const nameLabel = badge.parentElement.querySelector(".pattern-name");
    if (nameLabel) nameLabel.textContent = "Randomizing...";
    frame++;
    setTimeout(spinFrame, delay);
  }

  spinFrame();
}

// Switch between the bracket and rankings.
const bracketViewport = document.getElementById("bracketViewport");
const rankingView = document.getElementById("rankingView");
document.getElementById("showBracket").addEventListener("click", () => {
  bracketViewport.hidden = false; rankingView.hidden = true;
  document.getElementById("showBracket").classList.add("active");
  document.getElementById("showRanking").classList.remove("active");
});
document.getElementById("showRanking").addEventListener("click", () => {
  bracketViewport.hidden = true; rankingView.hidden = false;
  document.getElementById("showRanking").classList.add("active");
  document.getElementById("showBracket").classList.remove("active");
  renderRanking();
});
function renderRanking() {
  // Rank all 32 teams by their current status, with active winners at the top.
  // Teams eliminated in later rounds rank above earlier eliminations; ranks remain unique.
  const rowsByTeam = new Map();
  teamNames.forEach((team, index) => {
    rowsByTeam.set(team, { team, score: 0, status: "n/a", seed: index, eliminatedRound: null });
  });

  // A later-round loss determines the team's final status.
  Object.values(matches).forEach(m => {
    if (!m.teams || !m.teams[0] || !m.teams[1] || m.winner === null || m.winner === undefined) return;
    const winner = m.teams[m.winner];
    const loser = m.teams[1 - m.winner];
    const round = m.id === "FINAL" ? 5 : Number(m.round) || 1;
    const winnerRow = rowsByTeam.get(winner);
    if (winnerRow && winnerRow.eliminatedRound === null) {
      winnerRow.score = Math.max(winnerRow.score, 5000 + round * 100);
      winnerRow.status = round === 5 ? "Champion" : "Winner · advanced";
    }
    const loserRow = rowsByTeam.get(loser);
    if (loserRow) {
      loserRow.eliminatedRound = round;
      loserRow.score = round === 5 ? 9000 : round * 1000;
      loserRow.status = round === 5 ? "Runner-up" : `Lost in Round ${round}`;
    }
  });

  const final = matches.FINAL;
  if (final && final.winner !== null && final.winner !== undefined && final.teams[0] && final.teams[1]) {
    const champion = rowsByTeam.get(final.teams[final.winner]);
    const runnerUp = rowsByTeam.get(final.teams[1 - final.winner]);
    if (champion) { champion.score = 10000; champion.status = "Champion"; }
    if (runnerUp) { runnerUp.score = 9000; runnerUp.status = "Runner-up"; }
  }

  // Both semifinal losers share third place.
  // Assign the shared status once the semifinal results are known.
  for (const semifinal of Object.values(matches).filter(m => Number(m.round) === 4)) {
    if (!semifinal.teams?.[0] || !semifinal.teams?.[1] || semifinal.winner === null || semifinal.winner === undefined) continue;
    const semifinalLoser = rowsByTeam.get(semifinal.teams[1 - semifinal.winner]);
    if (semifinalLoser) {
      semifinalLoser.score = 4000;
      semifinalLoser.status = "Third place";
      semifinalLoser.sharedThird = true;
    }
  }

  const rows = [...rowsByTeam.values()].sort((a, b) => {
    // Higher scores rank first; later-round eliminations rank above earlier ones.
    // Use bracket seed as the tiebreaker to keep ranks 1–32 unique.
    return b.score - a.score || a.seed - b.seed;
  });
  const table = document.getElementById("rankingTable");
  table.innerHTML = "";
  let displayRank = 1;
  rows.forEach((row, index) => {
    const div = document.createElement("div");
    div.className = "rank-row";
    const rank = document.createElement("div");
    rank.className = "rank-number";
    rank.textContent = row.sharedThird ? "3rd Place" : `Rank ${displayRank}`;
    // The two third-place teams share rank 3, so skip rank 4.
    displayRank += row.sharedThird ? 0 : 1;
    if (index + 1 < rows.length && row.sharedThird && !rows[index + 1].sharedThird) displayRank = Math.max(displayRank, 5);
    const team = document.createElement("div");
    team.className = "rank-team";
    team.textContent = row.team;
    const status = document.createElement("div");
    status.className = "rank-status";
    status.textContent = row.status;
    div.append(rank, team, status);
    table.appendChild(div);
  });
}

// Create the match cards.
function render() {
  board.querySelectorAll(".match").forEach(el => el.remove());

  Object.values(matches).forEach(m => {
    const card = document.createElement("div");
    card.className = "match";
    if (m.id === "FINAL") card.classList.add("final-match");

    card.style.left = `${m.x}px`;
    card.style.top = `${m.y}px`;

    const label = document.createElement("div");
    label.className = "round-title";
    label.textContent =
      m.round === 1 ? "Round 1" :
      m.round === 2 ? "Round 2" :
      m.round === 3 ? "Round 3" :
      m.round === 4 ? "Round 4" : "Final Round";

    const list = document.createElement("div");
    list.className = "teams";

    m.teams.forEach((name, slot) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "team";
      btn.textContent = name || "";
      btn.disabled = !name;
      if (m.revealSlot === slot) {
      btn.classList.add("reveal");
      delete m.revealSlot;
} 

      if (m.winner === slot) {
        btn.classList.add("winner");
      }

      btn.disabled = !name || !isControl;
      btn.addEventListener("click", () => {
        chooseWinner(m.id, slot);
      });

      list.appendChild(btn);
    });

    const badge = document.createElement("button");
    badge.type = "button";
    badge.className = "coffee";
    if (m.patternChanged) {
      badge.classList.add("pattern-reveal");
      delete m.patternChanged;
    }
    badge.disabled = !!m.spinning || !isControl;
    badge.setAttribute("aria-label", m.spinning ? "Randomizing latte art" : (m.pattern ? "Randomize latte art again" : "Randomize latte art"));
    badge.title = m.spinning ? "Randomizing..." : (m.pattern ? "Click to randomize again" : "Click to randomize latte art");
    badge.innerHTML = m.pattern
      ? `<img src="${m.pattern}" alt="${m.patternName || "Latte Art Pattern"}">`
      : "<span>?</span>";
    badge.addEventListener("click", () => randomizePattern(m.id, badge));

    const patternName = document.createElement("div");
    patternName.className = "pattern-name";
    patternName.textContent = m.spinning ? "Randomizing..." : (m.patternName || "");

    card.append(label, list, badge, patternName);
    board.appendChild(card);
  });

  drawWires();
  if (!rankingView.hidden) renderRanking();

}

// Draw connectors from two matches to the next match.
function drawWires() {
  const svg = document.getElementById("wires");
  svg.innerHTML = "";
  function path(d) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); svg.appendChild(p);
  }
  function connect(a, b, target) {
    const rightward = a.side === "L";
    const startX1 = rightward ? a.x + 170 : a.x;
    const startX2 = rightward ? b.x + 170 : b.x;
    const endX = rightward ? target.x : target.x + (target.id === "FINAL" ? 190 : 170);
    const elbowX = (startX1 + endX) / 2;
    const ay = a.y + 32, by = b.y + 32, ty = target.y + 32;
    path(`M ${startX1} ${ay} H ${elbowX} V ${ty}`);
    path(`M ${startX2} ${by} H ${elbowX} V ${ty}`);
    path(`M ${elbowX} ${ty} H ${endX}`);
  }
  for (const side of ["L", "R"]) {
    for (let round = 1; round <= 3; round++) {
      const count = [8, 4, 2][round - 1];
      for (let i = 0; i < count; i += 2) {
        connect(matches[`${side}${round}-${i}`], matches[`${side}${round}-${i+1}`], matches[`${side}${round+1}-${i/2}`]);
      }
    }
    connect(matches[`${side}4-0`], matches[`${side}4-0`], matches.FINAL);
  }
} 

function resetDraw() {
  if (!isControl) return;
  if (!confirm("Reset the entire draw to its default state?\n\nTeam names, match results, latte art, and all round data will be cleared. The display screen will also be reset.")) return;

  // Restore the default team names A–AF (32 teams).
  const defaultNames = Array.from({ length: 32 }, (_, i) => teamLabel(i));
  defaultNames.forEach((name, i) => { teamNames[i] = name; });

  // Clear winners, selected patterns, effects, and all match data.
  Object.values(matches).forEach(m => {
    m.winner = null;
    m.pattern = null;
    m.patternName = "";
    m.revealSlot = null;
    m.teams = m.round === 1
      ? [teamNames[(m.side === "R" ? 16 : 0) + m.index * 2], teamNames[(m.side === "R" ? 16 : 0) + m.index * 2 + 1]]
      : ["", ""];
  });

  // Save defaults so the display screen receives the reset through the storage event.
  saveState();
  renderTeamEditor();
  render();
}

function renderTeamEditor() {
  const grid = document.getElementById("teamEditGrid");
  if (!grid || !isControl) return;
  grid.innerHTML = "";
  teamNames.forEach((name, index) => {
    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 50;
    input.value = name;
    input.dataset.index = String(index);
    input.setAttribute("aria-label", `Team ${index + 1} name`);
    input.placeholder = `Team ${index + 1} name`;
    grid.appendChild(input);
  });
}

document.getElementById("saveNames").addEventListener("click", () => {
  if (!isControl) return;
  const inputs = [...document.querySelectorAll("#teamEditGrid input")];
  inputs.forEach((input, index) => { teamNames[index] = input.value.trim() || `Team ${index + 1}`; });
  // Restart the bracket after renaming teams so old results are not tied to the old names.
  Object.values(matches).forEach(m => {
    m.winner = null;
    m.pattern = null;
    m.patternName = "";
    if (m.round === 1) {
      const base = m.side === "R" ? 16 : 0;
      m.teams = [teamNames[base + m.index * 2], teamNames[base + m.index * 2 + 1]];
    } else m.teams = ["", ""];
  });
  render(); saveState();
  alert("Team names saved. Previous match results have been cleared.");
});
document.getElementById("resetButton").addEventListener("click", resetDraw);

loadState();
render();
loadDisplayConfig();
if (isControl) renderTeamEditor();
</script>
